<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Data - Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Profile.css">
</head>

<body>
    <header>
        <div class="menu-right" dir="rtl">
            <button class="btn-login-blog">
                <a href="./Setting.html"> <img src="./as/img/Profile Picture.svg" alt="">
                </a>
                <img src="./as/icon/Icon.png" alt="">
            </button>
        </div>
        <div class="coreHelp" dir="rtl">
            <button>Help
                <img src="./as/icon/global.png" alt="">
                <span>|</span>
            </button>
        </div>
        <div class="menu-left bg-image">
            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid">
                    <a class="navbar-brand mb-3" href="#"><img src="./as/img/Group 1.png" alt=""></a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="#"
                                    style="color: #3A4B4F;">Destinations</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#" style="color: #3A4B4F;">Packages</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
        <hr>
    </header>
    <div class="container" style="max-width: 1100px;">
        <div class="row">
            <!-- Left Sidebar -->
            <div class="col-lg-3 col-md-4">
                <!-- Profile Block -->
                <div class="sidebar-card d-flex align-items-center p-3">
                    <img src="./as/img/Profile Picture.svg" class="profile-avatar me-3" alt="Anna Smith">
                    <div>
                        <h2 class="profile-name">Anna Smith</h2>
                        <p class="profile-email">anna.smith@gmail.com</p>
                    </div>
                </div>
                <!-- Nav Menu Block -->
                <div class="sidebar-card">
                    <a href="./Profile.html" class="nav-item2 active">
                        <i class="fas fa-user icon-left"></i> Personal data
                        <i class="fas fa-chevron-right icon-right"></i>
                    </a>
                    <a href="./History.html" class="nav-item2">
                        <i class="far fa-calendar-check icon-left"></i> Booking history
                    </a>
                    <a href="./Companions.html" class="nav-item2">
                        <i class="fas fa-user-friends icon-left"></i> Companions
                    </a>
                    <a href="./Favourite.html" class="nav-item2">
                        <i class="far fa-heart icon-left"></i> Favourites
                    </a>
                    <a href="" class="nav-item2">
                        <i class="far fa-life-ring icon-left"></i> Help
                    </a>
                    <a href="./Setting.html" class="nav-item2">
                        <i class="fas fa-cog icon-left"></i> Account settings
                    </a>
                </div>

                <!-- Logout Block -->
                <div class="sidebar-card">
                    <a href="./index.html" class="nav-item2 logout-item">
                        <i class="fas fa-sign-out-alt icon-left"></i> Log out
                    </a>
                </div>

            </div>

            <!-- Right Content Area -->
            <div class="col-lg-9 col-md-8">

                <!-- Personal Information -->
                <div class="content-card">
                    <div class="content-title">Personal Information</div>
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label class="custom-label">First Name</label>
                            <input type="text" class="custom-input" placeholder="Anna">
                        </div>
                        <div class="col-md-6 form-group">
                            <label class="custom-label">Last Name</label>
                            <input type="text" class="custom-input" placeholder="Smith">
                        </div>
                        <div class="col-md-6 form-group mb-md-0 mb-3">
                            <div class="col-sm-6">
                                <label class="form-label">Date of birth</label>
                                <div class="jbw-dob-group">
                                    <select class="form-select">
                                        <option>16</option>
                                    </select>
                                    <select class="form-select">
                                        <option>09</option>
                                    </select>
                                    <select class="form-select">
                                        <option>1995</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 form-group mb-0">
                            <label class="custom-label">Phone number</label>
                            <input type="text" class="custom-input" placeholder="e.g., +1234567890">
                        </div>
                    </div>
                </div>

                <!-- Personal Address -->
                <div class="content-card">
                    <div class="content-title">Personal Address</div>
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label class="custom-label">E-mail</label>
                            <input type="email" class="custom-input" placeholder="anna.smith@gmail.com">
                        </div>
                        <div class="col-md-6 form-group">
                            <label class="custom-label">Nationality</label>
                            <select class="custom-select">
                                <option>Irainian</option>
                                <option>American</option>
                                <option>Canadian</option>
                            </select>
                        </div>
                        <div class="col-md-6 form-group mb-md-0 mb-3">
                            <label class="custom-label">Address 1</label>
                            <input type="text" class="custom-input">
                        </div>
                        <div class="col-md-6 form-group mb-0">
                            <label class="custom-label">Address 2</label>
                            <input type="text" class="custom-input" placeholder="e.g., Apt 4B, Suite 205, Building 7">
                        </div>
                    </div>
                </div>

                <!-- Buttons outside the card -->
                <div class="action-buttons">
                    <button type="button" class="btn-discard">Discard</button>
                    <a href="./History.html"> <button type="submit" class="btn-save fs-6">Save</button>
                    </a>
                </div>

            </div>

        </div>
    </div>

</body>

</html>
