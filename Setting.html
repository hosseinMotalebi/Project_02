<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile/Setting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/8.2.0/mdb.min.css">
    <link rel="stylesheet" href="./Companions.css">
    <link rel="stylesheet" href="./Setting.css">
</head>

<body>
    <!-- --Header-- -->
    <header>
        <div class="menu-right" dir="rtl">
            <button class="btn-login-blog">
                <img src="./as/img/Profile Picture.svg" alt="">
                <img src="./as/icon/Icon.png" alt="">
            </button>
        </div>
        <div class="coreHelp" dir="rtl">
            <button>Help
                <img src="./as/icon/global.png" alt="">
                <span>|</span>
            </button>
        </div>
        <div class="menu-left bg-image">
            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid">
                    <a class="navbar-brand mb-3" href="#"><img src="./as/img/Group 1.png" alt=""></a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="#"
                                    style="color: #3A4B4F;">Destinations</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#" style="color: #3A4B4F;">Packages</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
        <hr>
    </header>
    <!-- --Header-- -->
    <div class="container" style="max-width: 1100px;">
        <div class="row">
            <div class="group-input col-lg-3 col-md-4 ">
                <div class="sidebar-card d-flex align-items-center p-3">
                    <img src="./as/img/Profile Picture.svg" class="profile-avatar me-3" alt="Anna Smith">
                    <div>
                        <h2 class="profile-name">Anna Smith</h2>
                        <p class="profile-email">anna.smith@gmail.com</p>
                    </div>
                </div>
                <div class="sidebar-card">
                    <a href="./Profile.html" class="nav-item2">
                        <i class="fas fa-user icon-left"></i> Personal data
                    </a>
                    <a href="./History.html" class="nav-item2">
                        <i class="far fa-calendar-check icon-left"></i> Booking history
                    </a>
                    <a href="./Companions.html" class="nav-item2">
                        <i class="fas fa-user-friends icon-left"></i> Companions

                    </a>
                    <a href="./Favourite.html" class="nav-item2">
                        <i class="far fa-heart icon-left"></i> Favourites
                    </a>
                    <a href="" class="nav-item2">
                        <i class="far fa-life-ring icon-left"></i> Help
                    </a>
                    <a href="./Setting.html" class="nav-item2 active">
                        <i class="fas fa-cog icon-left"></i> Account settings
                        <i class="fas fa-chevron-right icon-right"></i>
                    </a>
                </div>
                <div class="sidebar-card">
                    <a href="./index.html" class="nav-item2 logout-item">
                        <i class="fas fa-sign-out-alt icon-left"></i> Log out
                    </a>
                </div>
            </div>
            <!-- Header -->

            <!-- --setting-- -->
            <main class="password-page">
                <section class="password-card">
                    <h1>Change Password</h1>

                    <form id="passwordForm" novalidate>
                        <div class="row g-0 form-row">
                            <!-- Old password -->
                            <div class="col-12 old-password">
                                <div class="form-outline" data-mdb-input-init>
                                    <input type="password" id="oldPassword" class="form-control password-input"
                                        required>
                                    <label class="form-label" for="oldPassword">Old Password</label>
                                </div>
                            </div>

                            <!-- New password -->
                            <div class="col-12 col-md-6 password-column">
                                <div class="form-outline" data-mdb-input-init>
                                    <input type="password" id="newPassword" class="form-control password-input"
                                        required>
                                    <label class="form-label" for="newPassword">New Password</label>
                                </div>
                            </div>

                            <!-- Confirm password -->
                            <div class="col-12 col-md-6 password-column confirm-column">
                                <div class="form-outline" data-mdb-input-init>
                                    <input type="password" id="confirmPassword" class="form-control password-input"
                                        required>
                                    <label class="form-label" for="confirmPassword">Confirm New Password</label>
                                </div>
                            </div>
                        </div>

                        <div class="actions">
                            <button type="button" id="discardBtn" class="btn discard-btn">
                                Discard
                            </button>

                            <button type="submit" class="btn save-btn">
                                Save
                            </button>
                        </div>
                        <div id="message" class="message" role="alert"></div>
                    </form>
                </section>
            </main>
            <!-- --setting-- -->
            <script type="text/javascript"
                src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/8.2.0/mdb.umd.min.js"></script>  
</body>

</html>
